name: CI

on:
  push:
    branches:
      - master
  pull_request:

# Least privilege: CI only needs to read the repository.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    name: Syntax check (modern Node)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # Dependency-free parse check. This runs on a supported Node LTS and
      # catches syntax errors even if the legacy test toolchain cannot be
      # installed, which is the first signal a fresh clone is checked with.
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Parse all JavaScript sources
        run: npm run test:syntax

  test:
    name: Lint + unit tests + coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Run the Node-only subset of `grunt test` (lint, QUnit unit tests,
      # dist build, docs assets). The full suite also includes a Jekyll HTML
      # validation step that requires Ruby; see Gruntfile.js `test` task.
      TWBS_TEST: core
    steps:
      - uses: actions/checkout@v4

      # Node 6 is the last runtime the legacy PhantomJS-based QUnit runner
      # supports cleanly (grunt 0.4.x / phantomjs 1.9.x era toolchain).
      # The migration off this toolchain is tracked in MODERNIZATION.md.
      - name: Use Node.js 6
        uses: actions/setup-node@v4
        with:
          node-version: 6

      - name: Install dependencies
        run: |
          cp grunt/npm-shrinkwrap.json ./npm-shrinkwrap.json
          npm install --no-audit --no-fund

      - name: Run lint, unit tests, dist build and coverage
        run: npm test

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: warn
        if: always()

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Production/runtime dependencies must never carry a high-severity
      # advisory. This check is blocking.
      - name: Audit production dependencies (blocking)
        run: npm audit --omit=dev --audit-level=high

      # The frozen 2016 devDependency tree has a known advisory baseline
      # (mostly grunt/phantomjs). Keep it visible on every push without
      # blocking merges until the toolchain migration in MODERNIZATION.md
      # lands; new *introduced* vulnerabilities are gated by the
      # dependency-review workflow on pull requests.
      - name: Audit dev toolchain (informational)
        continue-on-error: true
        run: npm audit --audit-level=high
